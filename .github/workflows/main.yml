name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "No 'build' script found in package.json, skipping npm run build."
            fi
          else
            echo "package.json not found, skipping npm install."
          fi

      - name: Check for APK or Build Files
        run: |
          echo "Searching for any existing APK files in the repository..."
          find . -name "*.apk"
          
          # यदि आपके प्रोजेक्ट में कोई पाइथन स्क्रिप्ट है जो APK बनाती है:
          if [ -f "scripts/customize_and_sign_apk.py" ]; then
            python3 scripts/customize_and_sign_apk.py
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-APK
          path: |
            *.apk
            **/*.apk
            dist/
            public/
          if-no-files-found: warn
