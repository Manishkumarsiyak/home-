name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install --no-audit --prefer-offline
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "No 'build' script found in package.json, skipping npm run build."
            fi
          else
            echo "package.json not found, skipping npm install."
          fi

      - name: Generate or Process APK
        run: |
          python3 -m pip install --upgrade pip
          
          # यदि आपके पास पाइथन स्क्रिप्ट है
          if [ -f "scripts/customize_and_sign_apk.py" ]; then
            echo "Running custom Python APK script..."
            python3 scripts/customize_and_sign_apk.py
          else
            echo "Creating output structure for Digital Guardian..."
            mkdir -p output_apk
            # यहाँ सुनिश्चित करें कि कोई फाइल या ज़िप/APK तैयार हो
            echo "Digital Guardian Web Build Ready" > output_apk/read_me.txt
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-APK
          path: |
            *.apk
            **/*.apk
            dist/
            public/
            output_apk/
          if-no-files-found: ignore
