name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          # 'cache: 'npm'' यहाँ से हटा दिया गया है क्योंकि lock file मौजूद नहीं है

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Build & Package Android APK
        run: |
          python3 -m pip install --upgrade pip
          if [ -f "scripts/customize_and_sign_apk.py" ]; then
            python3 scripts/customize_and_sign_apk.py
          else
            echo "Building default standalone APK structure..."
            mkdir -p public
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-APK
          path: |
            public/*.apk
            dist/
