name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "No 'build' script found in package.json, skipping npm run build."
            fi
          else
            echo "package.json not found, skipping npm install."
          fi

      - name: Build Android APK / Package Files
        run: |
          python3 -m pip install --upgrade pip
          if [ -f "scripts/customize_and_sign_apk.py" ]; then
            python3 scripts/customize_and_sign_apk.py
          else
            echo "Running custom build steps..."
            # यदि आपके पास कोई एंड्रॉइड बिल्ड कमांड (Gradle आदि) है तो यहाँ आएगी
            # उदाहरण के लिए, यदि आपकी वेब फाइलों को जिप या किसी फोल्डर में रखना है:
            mkdir -p output_apk
            # यदि आपकी कोई APK फाइल बनती है तो उसे output_apk में कॉपी करें:
            # cp path/to/your.apk output_apk/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-APK
          path: |
            *.apk
            **/*.apk
            dist/
            public/
            output_apk/
          if-no-files-found: ignore
