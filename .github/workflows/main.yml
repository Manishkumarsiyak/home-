name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Java (Required for Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No 'build' script found, creating dist folder..."
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Initialize Capacitor and Build APK
        run: |
          # यदि आपके प्रोजेक्ट में पहले से capacitor नहीं है, तो इसे जोड़ें
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Digital Guardian" "com.digital.guardian" --web-dir dist
          else
            npm install
          fi

          # एंड्रॉइड प्लेटफॉर्म जोड़ें और सिंक करें
          npx cap add android || true
          npx cap sync android

          # APK जनरेट करें (Debug APK)
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..

      - name: Locate and Move APK File
        run: |
          mkdir -p final_apk
          find . -name "*.apk" -exec cp {} final_apk/ \;
          echo "Listing generated APKs:"
          ls -la final_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-Android-APK
          path: final_apk/*.apk
          if-no-files-found: error
