name: Build Digital Guardian APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install
            # चेक करें कि package.json में build स्क्रिप्ट है या नहीं
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "No 'build' script found in package.json, skipping npm run build."
            fi
          else
            echo "package.json not found, skipping npm install."
          fi

      - name: Build & Package Android APK
        run: |
          python3 -m pip install --upgrade pip
          if [ -f "scripts/customize_and_sign_apk.py" ]; then
            python3 scripts/customize_and_sign_apk.py
          else
            echo "Building default standalone APK structure..."
            mkdir -p public dist
            # यहाँ आप अपनी APK जनरेशन कमांड या स्क्रिप्ट जोड़ सकते हैं
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGuardian-APK
          path: |
            public/*.apk
            dist/*.apk
            *.apk
        continue-on-error: true
