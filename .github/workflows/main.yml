name: manish choudhary jaat

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi
          
          # यदि फ़ाइलें किसी सब-फ़ोल्डर में अनज़िप हुई हैं, तो उन्हें मुख्य फ़ोल्डर में लाना
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              DIR_PATH=$(dirname "$SETTINGS_PATH")
              echo "Moving files from $DIR_PATH to root..."
              cp -r "$DIR_PATH"/* .
            fi
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioModifier-Clean-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
name: manish choudhary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # यदि प्रोजेक्ट ज़िप रूप में है तो अनज़िप करेगा
      - name: Unzip project if uploaded as zip
        run: |
          if [ -f "raksha-ai.zip" ]; then
            unzip -o raksha-ai.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # मिसिंग debug.keystore को ऑटो-जनरेट करेगा
      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # पूरे रनर में बनी APK को ढूंढकर अपलोड करेगा
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RakshaAI-Debug-APK
          path: '**/*.apk'
          if-no-files-found: error
